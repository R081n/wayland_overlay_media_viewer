[package]
name = "wayland_overlay_media_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]

# TODO remove unneded features

clap = { version = "4.5", features = ["derive"] }

raw-window-handle = "0.6.2"
wgpu = { version = "29.0.3" }

# wayland
wayland-backend = { version = "0.3.11", features = ["client_system"] }
wayland-client = { version = "0.31.11" }
wayland-protocols = { version = "0.32.9", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.8", features = ["client"] }

#videos
ffmpeg-next = "8.0"
cpal = "0.15"
image = "0.25"
ringbuf = "0.4"
bevy_framepace = "0.22.0"
thiserror = "2.0.17"
crossbeam-channel = "0.5.16"
bevy_rand = { version = "0.15.0", features = ["wyrand"] }
rand_core = "0.10.1"
rand = "0.10.2"

[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "http",
    "https",
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",

    # all the collections that we need
    "picking",
    "default_app",
    "common_api",
    "3d_api",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",

    #default_platform without winit
    "std",
    "default_font",
    "multi_threaded",
    "wayland",
]

[profile.dev]
opt-level = 2
debug = true
